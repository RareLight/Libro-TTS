[project]
name = "libro-tts"
version = "0.1.0"
description = "Batch text-to-speech CLI for Apple Silicon Macs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio[tts,stt]==0.4.3",
    "mlx==0.30.6",
    "mlx-lm==0.31.1",
    "huggingface-hub==1.8.0",
    "transformers==5.4.0",
    "numpy==2.2.6",
    "misaki==0.9.4",
    "spacy==3.8.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "mistral-common[audio]==1.11.0",
    "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = ["ruff==0.12.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# spaCy 3.8's CLI imports Click; retain the inspected compatible Typer/Click
# combination instead of resolving to newer Typer's changed dependency stack.
constraint-dependencies = ["typer==0.24.1", "click==8.2.1"]

[tool.uv.sources]
# The inspected installation used this Git revision, not PyPI's different
# distribution carrying the same 0.4.3 version number.
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio.git", rev = "e42e1431fcf89af313375296c46d03a0153c4aa7" }

[tool.ruff.lint.per-file-ignores]
# Standalone scripts add the source checkout to sys.path before app imports.
"scripts/benchmark_chunk_parallel.py" = ["E402"]
"tests/integration_run_all_models.py" = ["E402"]
